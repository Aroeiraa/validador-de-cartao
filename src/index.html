<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Cartão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Validador de Cartão de Crédito</h1>
        <input type="text" id="cardNumber" placeholder="Digite o número do cartão">
        <input type="text" id="cvv" placeholder="Digite o CVV">
        <input type="text" id="expiryDate" placeholder="Digite a data de validade (MM/AA)">
        <button id="validateButton">Validar</button>
        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
